<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplicación generada</title>
<style>{{CSS}}</style>
</head>
<body>
<main id="application">
  <header>
    <div><p class="product">MDA STUDIO · APLICACIÓN EJECUTABLE (M2T)</p><h1 id="app-title"></h1><p id="app-description" class="muted"></p></div>
    <label class="role">Rol de demostración<select id="app-role" aria-describedby="app-role-help"></select><small class="muted" id="app-role-help">Simula quién realiza la tarea.</small></label>
  </header>
  <section id="db-bar" class="db-bar" aria-label="Conexión a Base de Datos y Archivo">
    <div class="db-info">
      <span id="db-badge" class="db-badge">BD IndexedDB activa</span>
      <span id="db-status-text" class="muted">Sincronizado en base de datos local del navegador.</span>
    </div>
    <div class="db-actions">
      <button type="button" id="db-connect-file" class="primary-outline">Conectar archivo (.db.json)</button>
      <button type="button" id="db-import-btn">Importar BD (.json)</button>
      <input type="file" id="db-import-input" accept=".json,application/json" hidden>
      <button type="button" id="db-export-json">Guardar BD (.db.json)</button>
      <button type="button" id="db-export-sql">Volcado SQL (.sql)</button>
      <button type="button" id="db-inspect-btn">Ver tablas / SQL</button>
    </div>
  </section>
  <nav id="app-nav" aria-label="Módulos de la aplicación" hidden>
    <button type="button" data-module="requests" aria-pressed="true">Solicitudes</button>
    <button type="button" data-module="catalog" aria-pressed="false">Inventario</button>
    <button type="button" data-module="ledger" aria-pressed="false">Movimientos</button>
  </nav>
  <p id="app-notice" role="status" aria-live="polite"></p>
  <div class="layout">
    <div class="column">
      <section id="app-create"><h2 id="app-form-title"></h2><form id="app-form"></form></section>
      <section id="app-cases"><div class="section-head"><h2 id="app-cases-title">Casos</h2><span id="app-count" class="muted"></span></div><div id="app-inbox"></div></section>
    </div>
    <section id="app-detail" tabindex="-1"></section>
  </div>
  <section id="crud-catalog" class="crud-catalog" hidden aria-labelledby="crud-title">
    <div class="crud-toolbar"><div><h2 id="crud-title">Registros</h2><p id="crud-count" class="muted" aria-live="polite"></p></div>
      <label>Buscar registros<input id="crud-search" type="search" placeholder="Escribe un valor…"></label>
    </div>
    <div class="crud-table" tabindex="0" role="region" aria-label="Tabla de registros"><table><thead><tr id="crud-columns"></tr></thead><tbody id="crud-rows"></tbody></table></div>
    <p id="crud-empty" class="muted"></p>
  </section>
  <section id="stock-ledger" aria-labelledby="stock-title" hidden><h2 id="stock-title">Movimientos de inventario</h2>
    <p id="stock-empty" class="muted">Todavía no hay entregas ni devoluciones registradas.</p><ol id="stock-movements"></ol>
  </section>
  <dialog id="crud-delete" aria-labelledby="crud-delete-title">
    <h2 id="crud-delete-title">¿Eliminar el registro?</h2><p id="crud-delete-name"></p>
    <div class="action-bar"><button id="crud-delete-cancel" type="button" autofocus>Cancelar</button><button id="crud-delete-confirm" type="button" class="danger">Confirmar eliminación</button></div>
  </dialog>
  <dialog id="db-dialog" aria-labelledby="db-dialog-title">
    <div class="section-head">
      <div><h2 id="db-dialog-title">Inspector de Base de Datos y Sentencias SQL</h2><p class="muted" id="db-dialog-subtitle"></p></div>
      <button type="button" id="db-dialog-close">Cerrar</button>
    </div>
    <pre id="db-dialog-sql" class="db-code"></pre>
  </dialog>
</main>
<script>{{SCRIPT}}</script>
</body>
</html>
